packages:
  - 'packages/*'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  svelte-preprocess: true
  unrs-resolver: true

preferWorkspacePackages: true

overrides:
  'tsconfig-paths@3.x': '^3.14.2'
  'tslib@2.x': '^2.4.0'
  'follow-redirects@<1.15.4': '>=1.15.4'
  'follow-redirects@<=1.15.5': '>=1.15.6'

patchedDependencies:
  unionfs: patches/unionfs.patch
